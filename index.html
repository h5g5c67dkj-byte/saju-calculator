<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Second form</title>
    <style>
      .container {
        max-width: 390px;
        margin: 0 auto;
      }
      form {
        text-align: center;
        display: flex;
        flex-direction:column;
        gap: 12px;
      }
      button {
        width: 100%;
        border: 1px solid rgb(52, 10, 116);
        border-radius: 20px;
        padding: 15px;
        background-color: rgb(52, 10, 116);
        color: white;
      }
      .column {
        text-align: left;
        border: 1px solid rgb(250, 237, 194);
        border-radius: 12px;
        padding: 16px 20px;
        background-color: rgb(250, 237, 194);
        display: flex;
        flex-direction: column;
      }
      input {
        width: 100%;
        height: 36px;
      }
      select {
        height: 36px;
        width: 25%;
        appearance: none;
        -webkit-appearance: none;
        padding-right: 32px;
        text-align: center;
        text-align-last: center;
      }
      .line {
        display: flex;
        gap: 8px;
      }
      .result {
        margin-top: 30px;
        text-align: center;
        display: none;
        flex-direction: column;
        gap: 20px;
      }
      
      table {
        width: 100%;
        border-collapse: collapse; /* 셀 사이 이중 테두리 없애기 */
      }

      th, td {
        border: 1px solid rgb(250, 237, 194);
        padding: 10px;
        text-align: center;
      }

      thead th {
        background-color: rgb(52, 10, 116);
        color: white;
      }

      tbody th {
        background-color: rgb(250, 237, 194);
      }
      
    </style>
  </head>
  <body>
    <form class="container">
      <h2>사주 입력</h2>
       <div class="column">
        <label for="name">이름: </label>
          <input type="text" name="name" id="name" required />
       </div>
      <div class="column">
        <label for="birthdate">생년월일: </label>
          <input type="date" name="birthdate" id="birthdate" required />
      </div>
      <div class="column">
        <label for="birthtime">태어난 시간:</label>
          <div class="line">
            <select name="dayornight" id="dayornight">
              <option value="day">오전</option>
              <option value="night">오후</option>
            </select>
            <select name="time" id="birthtime">
              <option value="">모름</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
            </select>
          </div>
      </div>
      <div class="column" >
        <label for="gender">성별:</label>
          <select name="gender" id="gender">
            <option value="female">여</option>
            <option value="male">남</option>
          </select>
      </div>
      <button type="button" id="submitBtn">제출</button>
    </form>
    <div class="container result">
      <h2 id="resultTitle">홍길동님의 사주</h2>
      <button type="button" id="resetBtn">다시 입력하기</button>
      <table>
        <thead>
          <tr>
            <th></th>
            <th>시주</th>
            <th>일주</th>
            <th>월주</th>
            <th>년주</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th>천간</th>
            <td id="timeHeaven">?</td>
            <td id="dayHeaven">?</td>
            <td id="monthHeaven">?</td>
            <td id="yearHeaven">?</td>
          </tr>
          <tr>
            <th>지지</th>
            <td id="timeEarth">?</td>
            <td id="dayEarth">?</td>
            <td id="monthEarth">?</td>
            <td id="yearEarth">?</td>
          </tr>
        </tbody>
      </table>
    </div>
    <script src="saju.js"></script>
  </body>
</html>
